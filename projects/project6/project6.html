<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ultra edit website nav bar</title>
    <style>
        nav {
            display: flex;
        }

        .bar {
            border: 1px solid rgb(185, 173, 173);
            display: flex;
            width: 1520px;
        }

        .bar ul {
            display: flex;
            list-style: none;
            align-items: center;
            justify-content: space-around;
            gap: 52px;
        }

        .elements ul {
            display: flex;
            justify-content: space-around;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <div class="bar">

                <div class="elements">
                    <ul>
                        <li class="img"><img src="https://www.ultraedit.com/wp-content/uploads/2023/01/UE-logo.svg"
                                alt="ultra edit image"></li>

                        <li><select name="products" id="products">
                                <option value="ultra edit">ultra edit</option>
                                <option value="ultra company">ultra company</option>
                            </select></li>
                        <li>Buy</li>
                        <li>renew</li>
                        <li>support</li>
                        <li>learn</li>
                        <li>company</li>
                        <li><a href="ue_allinone.exe">Dowload</a></li>
                        <li>english</li>
                        <li><input type="text">Search</li>
                </div>
                </ul>
            </div>
        </nav>
    </header>

</body>

</html>
