<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form for students</title>
</head>
<h1>sign up form for students</h1>

<body>
    <form action="submit">
        <label for="name" id="name">
            <h3>Name</h3>
        </label>
        <div>
            <input type="text" placeholder="name">
        </div>
        <label for="class" id="class">
            <h3>class</h3>
        </label>
        <div>
            <select name="class">
                <option value="P1"> P1 </option>
                <option value="P2"> P2 </option>
                <option value="P3"> P3 </option>
                <option value="P4"> P4 </option>
                <option value="C1"> C1 </option>
                <option value="C2"> C2 </option>
                <option value="C3"> C3 </option>
            </select>
        </div>
        <label for="roll no" name="roll no" id="roll no">
            <h3>Roll No.</h3>
        </label>
        <div>
            <input type="text" placeholder="roll no">
        </div>
        <label for="course" name="course" id="course">
            <h3>course</h3>
        </label>
        <div>
            <select name="course" id="course">
                <option value="b.tech"> B.Tech</option>
                <option value="b.sc">B.sc</option>
                <option value="bba"> BBA</option>
                <option value="bca"> Bca </option>
                <option value="b.com"> B.com</option>
            </select>
        </div>
        <label for="mobile number" name="mobile number">
            <h3>mobile number</h3>
        </label>
        <div>
            <input type="text" placeholder="+91">
        </div>
        <label for="sign up" name="sign up">
            <h3>sign up</h3>
        </label>
        <div>
            <input type="submit">
        </div>
    </form>
</body>

</html>
