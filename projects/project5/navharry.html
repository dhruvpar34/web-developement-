<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nav bar</title>
    <style>
        .logo {
            .logo img {}
        }

        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .right ul {
            display: flex;
            gap: 34px;
            list-style: none;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <div class="logo">
                <img src="https://www.ultraedit.com/wp-content/uploads/2023/01/UE-logo.svg" alt=" ultra Edit">
            </div>
            <div class="right">
                <ul>
                    <li>product</li>
                    <li>pricing</li>
                    <li>resources</li>
                    <li>about us</li>
                    <div class="end"><img src="" alt=""></div>
                </ul>
            </div>
        </nav>
    </header>

</body>

</html>
